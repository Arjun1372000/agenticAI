[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "predictive-maintenance"
version = "0.1.0"
description = "Predictive maintenance and bearing vibration diagnostics"
requires-python = ">=3.12"

dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "xgboost",
    "joblib",
    "fastapi",
    "uvicorn[standard]",
]


[tool.setuptools.packages.find]
where = ["src"]